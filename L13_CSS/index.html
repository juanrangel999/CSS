<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="styles.css" rel="stylesheet" /> 
    <title>Availability Table</title>
</head>

<body>
    <table>
        <caption>Weekly Meeting Availability Schedule</caption>
<tr>
    <th scope="col"></th>
    <th scope="col">Monday</th><th scope="col">Tuesday</th><th scope="col">Wednesday</th><th scope="col">Thursday</th><th scope="col">Friday</th>
</tr>
<tr class="sharp">
    <th class="time" scope="row">08:00</th>
    <td class="available-3" aria-label="3 available">8</td>

    <td class="available-1" aria-label="1 available">8</td>

    <td class="available-5" aria-label="5+ available">8</td>

    <td class="available-2" aria-label="2 available">8</td>

    <td class="available-4" aria-label="4 available">8</td>

</tr>
<tr class="half">
<th class="time" scope="row">10:00</th>

<td class="available-5" aria-label="5+ available">8</td>

<td class="available-4" aria-label="4 available">8</td>

<td class="available-2" aria-label="2 available">8</td>

<td class="available-1" aria-label="1 available">8</td>

<td class="available-3" aria-label="3 available">8</td>
</tr>
<tr class="sharp">
<th class="time" scope="row">12:00</th>

<td class="available-1" aria-label="1 available">8</td>

<td class="available-0" aria-label="0 available">8</td>

<td class="available-4" aria-label="4 available">8</td>

<td class="available-5" aria-label="5+ available">8</td>

<td class="available-2" aria-label="2 available">8</td>
</tr>
<tr class="half">
<th class="time" scope="row">14:00</th>

<td class="available-2" aria-label="2 available">8</td>

<td class="available-5" aria-label="5+ available">8</td>

<td class="available-1" aria-label="1 available">8</td>

<td class="available-3" aria-label="3 available">8</td>

<td class="available-4" aria-label="4 available">8</td>
</tr>
<tr class="sharp">
<th class="time" scope="row">16:00</th>

<td class="available-3" aria-label="3 available">8</td>

<td class="available-4" aria-label="4 available">8</td>

<td class="available-0" aria-label="0 available">8</td>

<td class="available-3" aria-label="3 available">8</td>

<td class="available-4" aria-label="4 available">8</td>
</tr>
<div id="legend">
    <span>Availability</span>
    <div id="legend-gradient"></div>
</div>

    </table>

</body>

</html>
