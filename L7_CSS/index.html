<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
iv class="form-container">
    <form>
        <h2>Suscripcion a esta Web</h2>
        <label for="name">Nombre de Usuario:</label>
        <input type="text" id="name" required name="user"/>
        <label for="email">Email:
        </label>
        <input type="email" name="email" required id="email"/>
        <label for="box">Comentarios:
        </label>
        <textarea id="box" name="box" required></textarea>
        <button type="submit">Submit</button>
    </form>
</div>
</body>
</html>
